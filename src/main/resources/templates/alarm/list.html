<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('告警列表')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('alarms')}"></aside>

<div class="main">
    <header th:replace="~{fragments/layout :: topbar('告警列表', '查看全部设备离线告警，确认告警并记录故障处理情况')}"></header>
    <div class="flash-wrap" th:replace="~{fragments/layout :: flash}"></div>

    <div class="content">
        <div class="stat-grid">
            <div class="stat warn">
                <div class="label">🔔 待处理告警</div>
                <div class="value" th:text="${pendingCount}">0</div>
                <div class="foot">需要运维人员确认处理</div>
            </div>
            <div class="stat info">
                <div class="label">📋 当前筛选结果</div>
                <div class="value" th:text="${page.total}">0</div>
                <div class="foot">条告警记录</div>
            </div>
            <div class="stat">
                <div class="label">📈 历史统计</div>
                <div class="value" style="font-size:18px;padding-top:10px">
                    <a class="btn btn-primary btn-sm" th:href="@{/alarms/statistics}">查看统计报表</a>
                </div>
                <div class="foot">故障排行 · 月度趋势 · 级别分布</div>
            </div>
        </div>

        <div class="card">
            <div class="card-head">
                <h3>告警记录</h3>
                <span class="sub">按告警时间倒序</span>
            </div>

            <form class="filter-bar" th:action="@{/alarms}" method="get">
                <div class="field">
                    <label>设备关键字</label>
                    <input class="input" type="text" name="keyword" th:value="${query.keyword}"
                           placeholder="设备名称 / IP"/>
                </div>
                <div class="field">
                    <label>告警级别</label>
                    <select class="select" name="level">
                        <option value="">全部级别</option>
                        <option value="URGENT" th:selected="${query.level == 'URGENT'}">紧急</option>
                        <option value="NORMAL" th:selected="${query.level == 'NORMAL'}">普通</option>
                    </select>
                </div>
                <div class="field">
                    <label>处理状态</label>
                    <select class="select" name="status">
                        <option value="">全部状态</option>
                        <option value="PENDING" th:selected="${query.status == 'PENDING'}">待处理</option>
                        <option value="CONFIRMED" th:selected="${query.status == 'CONFIRMED'}">已确认</option>
                        <option value="RECOVERED" th:selected="${query.status == 'RECOVERED'}">已恢复</option>
                        <option value="CLOSED" th:selected="${query.status == 'CLOSED'}">已关闭</option>
                    </select>
                </div>
                <div class="field">
                    <label>告警类型</label>
                    <select class="select" name="type">
                        <option value="">全部类型</option>
                        <option value="OFFLINE" th:selected="${query.type == 'OFFLINE'}">设备离线</option>
                        <option value="RECOVER" th:selected="${query.type == 'RECOVER'}">设备恢复</option>
                    </select>
                </div>
                <div class="field">
                    <label>开始日期</label>
                    <input class="input" type="date" name="startDate" th:value="${query.startDate}"/>
                </div>
                <div class="field">
                    <label>结束日期</label>
                    <input class="input" type="date" name="endDate" th:value="${query.endDate}"/>
                </div>
                <button class="btn btn-primary" type="submit">查询</button>
                <a class="btn btn-ghost" th:href="@{/alarms}">重置</a>
            </form>

            <div class="table-wrap" th:if="${not #lists.isEmpty(page.records)}">
                <table class="data">
                    <thead>
                    <tr>
                        <th>告警时间</th>
                        <th>设备</th>
                        <th>类型</th>
                        <th>级别</th>
                        <th>状态</th>
                        <th>持续时长</th>
                        <th>确认人</th>
                        <th class="right">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${page.records}">
                        <td class="mono small"
                            th:text="${a.alarmTime != null ? #temporals.format(a.alarmTime, 'yyyy-MM-dd HH:mm:ss') : '—'}">—</td>
                        <td>
                            <div class="cell-main" th:text="${a.deviceName}">设备</div>
                            <div class="cell-sub"
                                 th:text="${a.deviceIp + ' · ' + (a.deviceTypeName != null ? a.deviceTypeName : '未分类')}">IP</div>
                        </td>
                        <td>
                            <span class="badge b-plain"
                                  th:text="${a.alarmType != null and a.alarmType.name() == 'RECOVER'} ? '恢复通知' : '设备离线'">设备离线</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${a.alarmLevel != null and a.alarmLevel.name() == 'URGENT'} ? 'b-urgent' : 'b-normal'"
                                  th:text="${a.alarmLevel != null and a.alarmLevel.name() == 'URGENT'} ? '紧急' : '普通'">普通</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${a.alarmStatus != null ? 'b-' + #strings.toLowerCase(a.alarmStatus.name()) : 'b-plain'}"
                                  th:text="${a.alarmStatus != null ? a.alarmStatus.desc : '待处理'}">待处理</span>
                        </td>
                        <td class="small" th:text="${a.durationText} ?: '—'">—</td>
                        <td class="small" th:text="${a.confirmUserName} ?: '—'">—</td>
                        <td class="right nowrap">
                            <a class="btn btn-ghost btn-sm" th:href="@{/alarms/{id}(id=${a.id})}">详情</a>
                            <a class="btn btn-primary btn-sm" th:if="${a.alarmStatus != null and a.alarmStatus.name() == 'PENDING'}"
                               th:href="@{/alarms/{id}(id=${a.id})}">去处理</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="empty" th:if="${#lists.isEmpty(page.records)}">
                <div class="ico">✅</div>
                <div class="t">没有符合条件的告警</div>
                <div class="d">调整筛选条件，或等待巡检发现新的设备故障</div>
            </div>

            <div class="pager" th:if="${page.pages > 1}">
                <span th:text="'第 ' + ${page.current} + ' / ' + ${page.pages} + ' 页，共 ' + ${page.total} + ' 条'">分页</span>
                <div class="spacer"></div>
                <a th:classappend="${page.current <= 1} ? 'disabled'"
                   th:href="@{/alarms(page=${page.current - 1}, size=${query.size}, keyword=${query.keyword}, level=${query.level}, status=${query.status}, type=${query.type}, startDate=${query.startDate}, endDate=${query.endDate})}">上一页</a>
                <a th:each="i : ${#numbers.sequence(1, page.pages)}"
                   th:if="${i >= page.current - 2 and i <= page.current + 2}"
                   th:classappend="${i == page.current} ? 'active'"
                   th:href="@{/alarms(page=${i}, size=${query.size}, keyword=${query.keyword}, level=${query.level}, status=${query.status}, type=${query.type}, startDate=${query.startDate}, endDate=${query.endDate})}"
                   th:text="${i}">1</a>
                <a th:classappend="${page.current >= page.pages} ? 'disabled'"
                   th:href="@{/alarms(page=${page.current + 1}, size=${query.size}, keyword=${query.keyword}, level=${query.level}, status=${query.status}, type=${query.type}, startDate=${query.startDate}, endDate=${query.endDate})}">下一页</a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
