<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' · NetGuard 网络故障告警监控平台'">NetGuard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- ============ 侧边导航 ============ -->
<aside class="sidebar" th:fragment="sidebar(active)">
    <div class="brand">
        <div class="logo">🛡</div>
        <div>
            <div class="name">NetGuard</div>
            <div class="sub">网络故障告警监控平台</div>
        </div>
    </div>
    <nav class="nav">
        <div class="group-title">监控中心</div>
        <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">
            <span class="ico">📊</span><span class="label">运行总览</span>
        </a>
        <a th:href="@{/devices}" th:classappend="${active == 'devices'} ? 'active'">
            <span class="ico">🖧</span><span class="label">设备管理</span>
        </a>
        <a th:href="@{/inspects}" th:classappend="${active == 'inspects'} ? 'active'">
            <span class="ico">🔄</span><span class="label">巡检记录</span>
        </a>

        <div class="group-title">告警处理</div>
        <a th:href="@{/alarms}" th:classappend="${active == 'alarms'} ? 'active'">
            <span class="ico">🔔</span><span class="label">告警列表</span>
            <span class="badge-dot" th:if="${globalPending != null and globalPending > 0}" th:text="${globalPending}">0</span>
        </a>
        <a th:href="@{/alarms/statistics}" th:classappend="${active == 'statistics'} ? 'active'">
            <span class="ico">📈</span><span class="label">告警统计</span>
        </a>
        <a th:href="@{/notices}" th:classappend="${active == 'notices'} ? 'active'">
            <span class="ico">✉️</span><span class="label">消息通知</span>
            <span class="badge-dot" th:if="${globalUnread != null and globalUnread > 0}" th:text="${globalUnread}">0</span>
        </a>

        <div class="group-title" sec:authorize="hasRole('ADMIN')">系统配置</div>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/types}" th:classappend="${active == 'types'} ? 'active'">
            <span class="ico">🏷</span><span class="label">设备类型</span>
        </a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/rule}" th:classappend="${active == 'rule'} ? 'active'">
            <span class="ico">⚙️</span><span class="label">告警规则</span>
        </a>

        <div class="group-title">账号</div>
        <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'active'">
            <span class="ico">👤</span><span class="label">个人中心</span>
        </a>
    </nav>
    <div class="sidebar-foot">
        <div>NetGuard v1.0.0</div>
        <div>Spring Boot · Thymeleaf</div>
    </div>
</aside>

<!-- ============ 顶部栏 ============ -->
<header class="topbar" th:fragment="topbar(title, subtitle)">
    <div>
        <div class="page-title" th:text="${title}">标题</div>
        <div class="page-sub" th:text="${subtitle}">副标题</div>
    </div>
    <div class="spacer"></div>
    <div class="top-actions">
        <span class="clock" id="topClock"></span>
        <a class="icon-btn" th:href="@{/notices}" title="未读消息">
            🔔
            <span class="dot" th:if="${globalUnread != null and globalUnread > 0}" th:text="${globalUnread}">0</span>
        </a>
        <div class="user-chip">
            <div class="avatar" th:text="${#strings.substring(#authentication.principal.realName ?: 'U', 0, 1)}">U</div>
            <div class="who">
                <div class="n" th:text="${#authentication.principal.realName}">用户</div>
                <div class="r" th:text="${#authentication.principal.admin} ? '系统管理员' : '运维人员'">角色</div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" style="margin:0">
            <button type="submit" class="btn btn-ghost btn-sm">退出</button>
        </form>
    </div>
</header>

<!-- ============ 闪存消息 ============ -->
<div class="flash-wrap" th:fragment="flash">
    <div class="flash" th:if="${msg}" th:classappend="${msgType} ?: 'success'">
        <span th:text="${msg}">提示</span>
    </div>
    <div class="flash danger" th:if="${errorMsg}">
        <span th:text="${errorMsg}">错误</span>
    </div>
</div>

<!-- ============ 通用脚本 ============ -->
<th:block th:fragment="scripts">
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
