<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('设备管理')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('devices')}"></aside>

<div class="main">
    <header th:replace="~{fragments/layout :: topbar('设备管理', '维护需要监控的网络设备及其类型、端口与重点标记')}"></header>
    <div class="flash-wrap" th:replace="~{fragments/layout :: flash}"></div>

    <div class="content">
        <div class="card">
            <div class="card-head">
                <h3>设备清单</h3>
                <span class="sub" th:text="'共 ' + ${page.total} + ' 台设备'">共 0 台</span>
                <div class="spacer"></div>
                <a class="btn btn-primary" sec:authorize="hasRole('ADMIN')" th:href="@{/devices/new}">+ 录入设备</a>
            </div>

            <!-- 筛选 -->
            <form class="filter-bar" th:action="@{/devices}" method="get">
                <div class="field">
                    <label>关键字</label>
                    <input class="input" type="text" name="keyword" th:value="${query.keyword}"
                           placeholder="设备名称 / IP / 编号"/>
                </div>
                <div class="field">
                    <label>设备类型</label>
                    <select class="select" name="typeId">
                        <option value="">全部类型</option>
                        <option th:each="t : ${types}" th:value="${t.id}" th:text="${t.typeName}"
                                th:selected="${query.typeId != null and query.typeId == t.id}">类型</option>
                    </select>
                </div>
                <div class="field">
                    <label>在线状态</label>
                    <select class="select" name="status">
                        <option value="">全部状态</option>
                        <option value="ONLINE" th:selected="${query.status == 'ONLINE'}">在线</option>
                        <option value="OFFLINE" th:selected="${query.status == 'OFFLINE'}">离线</option>
                        <option value="UNKNOWN" th:selected="${query.status == 'UNKNOWN'}">未知</option>
                    </select>
                </div>
                <div class="field">
                    <label>排序</label>
                    <select class="select" name="sortField">
                        <option value="">默认排序</option>
                        <option value="last_check_time" th:selected="${query.sortField == 'last_check_time'}">最近巡检时间</option>
                        <option value="offline_count" th:selected="${query.sortField == 'offline_count'}">离线次数</option>
                        <option value="device_name" th:selected="${query.sortField == 'device_name'}">设备名称</option>
                    </select>
                </div>
                <button class="btn btn-primary" type="submit">查询</button>
                <a class="btn btn-ghost" th:href="@{/devices}">重置</a>
            </form>

            <div class="table-wrap" th:if="${not #lists.isEmpty(page.records)}">
                <table class="data">
                    <thead>
                    <tr>
                        <th>设备</th>
                        <th>类型</th>
                        <th>IP / 端口</th>
                        <th>状态</th>
                        <th>最近巡检</th>
                        <th>离线次数</th>
                        <th>告警数</th>
                        <th class="right">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${page.records}">
                        <td>
                            <div class="row gap-8">
                                <span class="badge b-core" th:if="${d.coreFlag == 1}">重点</span>
                                <div>
                                    <div class="cell-main" th:text="${d.deviceName}">设备名称</div>
                                    <div class="cell-sub"
                                         th:text="${d.location != null and !#strings.isEmpty(d.location) ? d.deviceCode + ' · ' + d.location : d.deviceCode}">编号</div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${d.typeName} ?: '未分类'">类型</td>
                        <td class="mono" th:text="${d.ipAddress} + ':' + ${d.monitorPort}">IP</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${d.status != null ? 'b-' + #strings.toLowerCase(d.status.name()) : 'b-unknown'}"
                                  th:text="${d.status != null ? d.status.desc : '未知'}">未知</span>
                        </td>
                        <td class="mono small"
                            th:text="${d.lastCheckTime != null ? #temporals.format(d.lastCheckTime, 'MM-dd HH:mm:ss') : '未巡检'}">未巡检</td>
                        <td>
                            <span th:text="${d.offlineCount}" th:classappend="${d.offlineCount > 0} ? 'text-danger bold'">0</span>
                        </td>
                        <td th:text="${d.alarmCount}">0</td>
                        <td class="right nowrap">
                            <form th:action="@{/devices/{id}/check(id=${d.id})}" method="post" style="display:inline">
                                <button class="btn btn-ghost btn-sm" type="submit">探测</button>
                            </form>
                            <a sec:authorize="hasRole('ADMIN')" class="btn btn-ghost btn-sm"
                               th:href="@{/devices/{id}/edit(id=${d.id})}">编辑</a>
                            <form sec:authorize="hasRole('ADMIN')" th:action="@{/devices/{id}/delete(id=${d.id})}"
                                  method="post" style="display:inline"
                                  th:data-confirm="'确定删除设备「' + ${d.deviceName} + '」吗？删除后其历史告警仍会保留。'">
                                <button class="btn btn-danger btn-sm" type="submit">删除</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="empty" th:if="${#lists.isEmpty(page.records)}">
                <div class="ico">🖧</div>
                <div class="t">还没有设备</div>
                <div class="d">点击右上角「录入设备」开始添加需要监控的网络设备</div>
            </div>

            <!-- 分页 -->
            <div class="pager" th:if="${page.pages > 1}">
                <span th:text="'第 ' + ${page.current} + ' / ' + ${page.pages} + ' 页，共 ' + ${page.total} + ' 条'">分页</span>
                <div class="spacer"></div>
                <a th:classappend="${page.current <= 1} ? 'disabled'"
                   th:href="@{/devices(page=${page.current - 1}, size=${query.size}, keyword=${query.keyword}, typeId=${query.typeId}, status=${query.status}, sortField=${query.sortField})}">上一页</a>
                <a th:each="i : ${#numbers.sequence(1, page.pages)}"
                   th:if="${i >= page.current - 2 and i <= page.current + 2}"
                   th:classappend="${i == page.current} ? 'active'"
                   th:href="@{/devices(page=${i}, size=${query.size}, keyword=${query.keyword}, typeId=${query.typeId}, status=${query.status}, sortField=${query.sortField})}"
                   th:text="${i}">1</a>
                <a th:classappend="${page.current >= page.pages} ? 'disabled'"
                   th:href="@{/devices(page=${page.current + 1}, size=${query.size}, keyword=${query.keyword}, typeId=${query.typeId}, status=${query.status}, sortField=${query.sortField})}">下一页</a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
