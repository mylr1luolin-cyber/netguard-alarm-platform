# ============================================================================
# NetGuard 网络故障告警监控平台 —— Nginx 反向代理配置
# ----------------------------------------------------------------------------
# 放置位置：/etc/nginx/conf.d/netguard.conf
#   （该目录已被发行版自带的 /etc/nginx/nginx.conf 在 http{} 内 include，
#    因此本文件的 upstream / server 块可直接生效；不要把本文件整份覆盖主配置）
# 生效命令：nginx -t && systemctl reload nginx
#
# 本文件假设：应用与 Nginx 同机部署，Spring Boot 监听 127.0.0.1:8080；
# 上传目录 /opt/netguard/uploads 与应用配置 app.upload.dir 保持一致。
# ============================================================================

# ----------------------------------------------------------------------------
# 1) upstream：定义后端应用节点池
#    - 同机端口 8080，与 application.yml 的 server.port 一致
#    - max_fails/fail_timeout：连续 3 次失败则 10 秒内不再转发，避免拖垮请求
#    - keepalive 32：与后端保持 32 个长连接，减少频繁建连开销
#      （需配合下面 location 中的 proxy_http_version 1.1 与 Connection ""）
# ----------------------------------------------------------------------------
upstream netguard_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ----------------------------------------------------------------------------
# 2) 80 端口：只做 HTTPS 跳转（证书就绪后取消下面整段注释）
#    说明：Spring Boot 本身不处理 HTTPS，TLS 统一由 Nginx 终止，
#          因此 80 端口不代理任何业务请求，只返回 301。
# ----------------------------------------------------------------------------
# server {
#     listen 80;
#     server_name netguard.example.com;
#
#     # 保留 URI 与查询串，浏览器地址栏会变成 https://...
#     return 301 https://$host$request_uri;
# }

# ----------------------------------------------------------------------------
# 2b) 【临时调试入口】证书尚未签发时使用：
#     先注释掉下面的 443 块，再取消本段注释，即可用 http://netguard.example.com 访问。
#     正式上线前务必改回 443 + 301，避免账号密码明文传输。
# ----------------------------------------------------------------------------
# server {
#     listen 80;
#     server_name netguard.example.com;
#     location / {
#         proxy_pass http://netguard_backend;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }

# ----------------------------------------------------------------------------
# 3) 443：HTTPS 主站（业务入口）
#    证书路径为占位符，请替换为真实证书：
#      /etc/nginx/ssl/netguard.crt（证书链，含中间证书）
#      /etc/nginx/ssl/netguard.key（私钥，权限 600，属主 root）
# ----------------------------------------------------------------------------
server {
    listen 443 ssl;
    # HTTP/2：Nginx >= 1.25.1 用下行写法；
    # 旧版本改为 listen 443 ssl http2;（1.25 起旧写法会有告警）
    # http2 on;
    server_name netguard.example.com;

    # ---------------- TLS 基础配置（仅启用 TLS 1.2 / 1.3） ----------------
    ssl_certificate     /etc/nginx/ssl/netguard.crt;
    ssl_certificate_key /etc/nginx/ssl/netguard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # TLS 1.2 建议套件；TLS 1.3 套件由 OpenSSL 默认提供，无需在此列出
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 可选：HSTS。首次上线先别开，确认全站 HTTPS 正常后再开启并逐步加长时间
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------------- 请求体大小 ----------------
    # 应用侧限制：multipart.max-file-size=5MB / max-request-size=10MB；
    # Nginx 这里给 6MB，留 1MB 余量，避免超限时被 Nginx 直接 413
    # （被 Nginx 拦掉时用户看不到应用返回的“图片不能超过 5MB”友好提示）
    client_max_body_size 6m;
    client_body_timeout  60s;
    client_header_timeout 20s;

    # ---------------- 访问日志 ----------------
    access_log /var/log/nginx/netguard.access.log;
    error_log  /var/log/nginx/netguard.error.log warn;

    # ---------------- gzip 压缩 ----------------
    # 页面为服务端渲染 HTML + 本地 ECharts/原生 JS，压缩收益明显；
    # 图片/字体本身已压缩，不重复压（png/jpg 不在 gzip_types 中）
    gzip              on;
    gzip_vary         on;          # 让代理/CDN 正确区分压缩与未压缩版本
    gzip_min_length   1024;        # 小于 1KB 压缩反而增大体积
    gzip_comp_level   5;           # 1~9，5 是速度与压缩率的平衡点
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/xml
                      application/json application/javascript
                      application/x-javascript image/svg+xml;

    # ---------------- Nginx 自身健康检查（可选） ----------------
    # 供 Keepalived / 云监控探测 Nginx 进程是否存活，不经过后端应用；
    # 想同时探后端就用 /login（见 deploy.sh 的 health_check）
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------- 上传图片：由 Nginx 直接读盘，不经过 Java ----------------
    # ^~ 前缀匹配优先于下面的正则 location，保证 .png 请求不会落进静态资源段
    # alias 必须以 / 结尾，且与 app.upload.dir=/opt/netguard/uploads 对应；
    # 应用保存路径形如 /uploads/2026/11/<uuid>.png，这里直接映射到磁盘同名路径。
    location ^~ /uploads/ {
        alias /opt/netguard/uploads/;
        autoindex off;                  # 禁止目录列表
        expires 7d;                     # 与静态资源一致的 7 天浏览器缓存
        add_header Cache-Control "public, max-age=604800";
        access_log off;                 # 图片量大，避免刷爆访问日志
        # 可选加固：仅允许图片扩展名
        # location ~* ^/uploads/.*\.(jpg|jpeg|png|gif)$ { }
        # 注意：alias 与 try_files 组合存在路径拼接歧义（$uri 带 /uploads/ 前缀），
        # 这里不写 try_files，文件不存在时 alias 会自然返回 404。
    }

    # ---------------- 静态资源：交给后端但由浏览器缓存 7 天 ----------------
    # 本项目 CSS/JS 打包在 jar 内（classpath:/static），无独立磁盘目录，
    # 因此仍 proxy_pass 到后端；用 expires 降低重复请求。
    location ~* \.(css|js|png|jpe?g|gif|ico|svg|woff2?|ttf|eot)$ {
        proxy_pass http://netguard_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ---------------- 业务请求：反向代理到 Spring Boot ----------------
    location / {
        proxy_pass http://netguard_backend;

        # 关键请求头：保证应用/日志拿到真实客户端信息
        # Host：让 Spring Security 生成的重定向地址与 Session Cookie 域正确
        proxy_set_header Host              $host;
        # X-Real-IP / X-Forwarded-For：后端日志与审计记录真实来源 IP
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto：应用判断原始协议（如后续生成绝对链接）
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Connection "";   # 配合 upstream keepalive，清空后启用长连接

        # 超时：登录/巡检触发等请求可能较慢，但不应无限等待
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 关闭响应缓冲对下载大文件无益，页面渲染保持默认开启即可
        proxy_buffering on;
    }

    # ---------------- 错误页（可选） ----------------
    # 后端未启动时 Nginx 返回 502/503/504，用静态页替代默认白页，避免暴露内部信息。
    # 需自备 /usr/share/nginx/html/50x.html。
    # error_page 502 503 504 /50x.html;
    # location = /50x.html {
    #     root /usr/share/nginx/html;
    #     internal;
    # }
}

# ============================================================================
# 附：以下指令属于 http{} 级，不能写在 server{} 里，如需调优请改主配置：
#   sendfile on;            零拷贝发送静态文件
#   tcp_nopush on;          与 sendfile 配合，减少小包
#   keepalive_timeout 65;   客户端长连接空闲时间
#   server_tokens off;      隐藏 Nginx 版本号
# ============================================================================
